name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d topsignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/topsignal
      AUTH_REQUIRED: "true"
      TOPSIGNAL_DB_SCHEMA_INIT: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate fresh PostgreSQL schema and migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d topsignal -v ON_ERROR_STOP=1 -f db/schema.sql
          python backend/tools/migrate_db.py --baseline
          python backend/tools/migrate_db.py --check
          psql -h 127.0.0.1 -U postgres -d topsignal -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if exists (
              select 1 from pg_tables
              where schemaname = 'public' and tablename like 'databento_%'
            ) then
              raise exception 'fresh schema unexpectedly created legacy Databento tables';
            end if;
          end
          $$;
          SQL

      - name: Validate latest incremental upgrade path
        env:
          PGPASSWORD: postgres
          UPGRADE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/topsignal_upgrade
        run: |
          createdb -h 127.0.0.1 -U postgres topsignal_upgrade
          psql -h 127.0.0.1 -U postgres -d topsignal_upgrade -v ON_ERROR_STOP=1 -f db/schema.sql
          DATABASE_URL="$UPGRADE_DATABASE_URL" python backend/tools/migrate_db.py --baseline
          psql -h 127.0.0.1 -U postgres -d topsignal_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          alter table bot_order_attempts drop constraint if exists bot_order_attempts_status_check;
          alter table bot_order_attempts add constraint bot_order_attempts_status_check
            check (status in ('pending','dry_run','submitted','blocked','rejected','error'));
          alter table bot_order_attempts drop constraint if exists bot_order_attempts_bot_config_id_fkey;
          alter table bot_order_attempts alter column bot_config_id set not null;
          alter table bot_order_attempts add constraint bot_order_attempts_bot_config_id_fkey
            foreign key (bot_config_id) references bot_configs(id) on delete cascade;
          alter table accounts drop column if exists balance;
          update instrument_metadata set tick_value = 9.99 where symbol = 'NQ';
          delete from instrument_metadata where symbol = 'ES';
          delete from topsignal_schema_migrations
          where version in (
            '20260710_add_bot_submission_unknown_status.sql',
            '20260710_add_cached_account_balance.sql',
            '20260710_enforce_bot_quantity_safety.sql',
            '20260710_preserve_bot_order_attempt_audit.sql',
            '20260711_add_databento_historical_market_data.sql',
            '20260711_seed_nq_es_instrument_metadata.sql'
          );
          SQL
          DATABASE_URL="$UPGRADE_DATABASE_URL" python backend/tools/migrate_db.py
          DATABASE_URL="$UPGRADE_DATABASE_URL" python backend/tools/migrate_db.py --check
          psql -h 127.0.0.1 -U postgres -d topsignal_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (
              select 1 from instrument_metadata
              where symbol = 'ES' and tick_size = 0.25 and tick_value = 12.50
            ) then
              raise exception 'latest migration did not seed ES defaults';
            end if;
            if not exists (
              select 1 from instrument_metadata
              where symbol = 'NQ' and tick_size = 0.25 and tick_value = 9.99
            ) then
              raise exception 'latest migration overwrote the existing NQ override';
            end if;
            if exists (
              select 1 from pg_tables
              where schemaname = 'public' and tablename like 'databento_%'
            ) then
              raise exception 'retired Databento migration recreated market tables';
            end if;
          end
          $$;
          SQL

      - name: Validate Supabase Data API privilege hardening
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d topsignal -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              execute 'create role anon nologin';
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              execute 'create role authenticated nologin';
            end if;
          end
          $$;

          create table public.topsignal_existing_grant_probe (id bigserial primary key);
          create function public.topsignal_existing_grant_probe_fn()
          returns integer language sql immutable as 'select 1';
          grant all privileges on public.topsignal_existing_grant_probe to public, anon, authenticated;
          grant all privileges on sequence public.topsignal_existing_grant_probe_id_seq to public, anon, authenticated;
          grant execute on function public.topsignal_existing_grant_probe_fn() to public, anon, authenticated;
          alter default privileges for role postgres
            grant select, insert, update, delete, truncate, references, trigger on tables to public;
          alter default privileges for role postgres
            grant select, insert, update, delete, truncate, references, trigger on tables to anon, authenticated;
          alter default privileges for role postgres
            grant usage, select, update on sequences to public;
          alter default privileges for role postgres
            grant usage, select, update on sequences to anon, authenticated;
          alter default privileges for role postgres
            grant execute on functions to anon, authenticated;
          alter default privileges for role postgres in schema public
            grant select, insert, update, delete, truncate, references, trigger on tables to public, anon, authenticated;
          alter default privileges for role postgres in schema public
            grant usage, select, update on sequences to public, anon, authenticated;
          alter default privileges for role postgres in schema public
            grant execute on functions to public, anon, authenticated;

          -- A deliberately under-privileged migration role makes the
          -- hardening DO block fail after psql has started the file. It can
          -- insert the baseline marker, so this proves the marker's safety
          -- comes from being inside the failed atomic block rather than from
          -- client-side ON_ERROR_STOP behavior.
          delete from topsignal_schema_baselines
          where version = 'schema-20260830-v6';
          do $$
          begin
            if not exists (
              select 1 from pg_roles
              where rolname = 'topsignal_limited_migrator'
            ) then
              execute 'create role topsignal_limited_migrator nologin';
            end if;
          end
          $$;
          grant usage, create on schema public to topsignal_limited_migrator;
          grant select, insert on topsignal_schema_baselines
            to topsignal_limited_migrator;

          do $$
          begin
            if not has_table_privilege('anon', 'public.topsignal_existing_grant_probe', 'select')
              or not has_sequence_privilege('authenticated', 'public.topsignal_existing_grant_probe_id_seq', 'usage')
              or not has_function_privilege('anon', 'public.topsignal_existing_grant_probe_fn()', 'execute')
            then
              raise exception 'Data API hardening fixture did not establish the unsafe grants';
            end if;
          end
          $$;
          SQL

          psql -h 127.0.0.1 -U postgres -d topsignal <<'SQL'
          \set ON_ERROR_STOP off
          set role topsignal_limited_migrator;
          \i db/migrations/20260830_harden_supabase_data_api.sql
          \if :ERROR
          \echo 'Observed the expected hardening permission failure.'
          \else
          \warn 'Limited-role hardening unexpectedly succeeded.'
          \quit 1
          \endif
          reset role;
          SQL

          psql -h 127.0.0.1 -U postgres -d topsignal -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if exists (
              select 1 from topsignal_schema_baselines
              where version = 'schema-20260830-v6'
            ) then
              raise exception 'failed hardening left a readiness marker';
            end if;
            if not has_table_privilege(
              'anon',
              'public.topsignal_existing_grant_probe',
              'select'
            ) then
              raise exception 'failed hardening leaked partial privilege changes';
            end if;
          end
          $$;
          SQL

          psql -h 127.0.0.1 -U postgres -d topsignal -v ON_ERROR_STOP=1 \
            -f db/migrations/20260830_harden_supabase_data_api.sql

          psql -h 127.0.0.1 -U postgres -d topsignal -v ON_ERROR_STOP=1 <<'SQL'
          create table public.topsignal_future_grant_probe (id bigserial primary key);
          create function public.topsignal_future_grant_probe_fn()
          returns integer language sql immutable as 'select 1';

          do $$
          declare
            api_role text;
          begin
            foreach api_role in array array['anon', 'authenticated']
            loop
              if has_table_privilege(
                api_role,
                'public.topsignal_existing_grant_probe',
                'select,insert,update,delete,truncate,references,trigger'
              )
                or has_sequence_privilege(
                  api_role,
                  'public.topsignal_existing_grant_probe_id_seq',
                  'usage,select,update'
                )
                or has_function_privilege(api_role, 'public.topsignal_existing_grant_probe_fn()', 'execute')
                or has_table_privilege(
                  api_role,
                  'public.topsignal_future_grant_probe',
                  'select,insert,update,delete,truncate,references,trigger'
                )
                or has_sequence_privilege(
                  api_role,
                  'public.topsignal_future_grant_probe_id_seq',
                  'usage,select,update'
                )
                or has_function_privilege(api_role, 'public.topsignal_future_grant_probe_fn()', 'execute')
              then
                raise exception 'Data API role % retained public-schema access', api_role;
              end if;
            end loop;
          end
          $$;
          SQL

      - name: Validate populated pre-runner adoption
        env:
          PGPASSWORD: postgres
          ADOPT_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/topsignal_adopt
        run: |
          createdb -h 127.0.0.1 -U postgres topsignal_adopt
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          create function public.topsignal_adoption_existing_probe_fn()
          returns integer language sql immutable as 'select 1';
          grant all privileges on public.accounts to public, anon, authenticated;
          grant all privileges on sequence public.accounts_id_seq to public, anon, authenticated;
          grant execute on function public.topsignal_adoption_existing_probe_fn() to public, anon, authenticated;
          alter default privileges for role postgres
            grant select, insert, update, delete, truncate, references, trigger on tables to public;
          alter default privileges for role postgres
            grant select, insert, update, delete, truncate, references, trigger on tables to anon, authenticated;
          alter default privileges for role postgres
            grant usage, select, update on sequences to public;
          alter default privileges for role postgres
            grant usage, select, update on sequences to anon, authenticated;
          alter default privileges for role postgres
            grant execute on functions to public, anon, authenticated;
          alter default privileges for role postgres in schema public
            grant select, insert, update, delete, truncate, references, trigger on tables to public, anon, authenticated;
          alter default privileges for role postgres in schema public
            grant usage, select, update on sequences to public, anon, authenticated;
          alter default privileges for role postgres in schema public
            grant execute on functions to public, anon, authenticated;
          delete from topsignal_schema_baselines where version = 'schema-20260830-v6';
          SQL
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 -c \
            "insert into accounts (provider, external_id, name) values ('projectx', '999001', 'Adoption Fixture')"

          assert_adoption_rejected() {
            local mutation_name="$1"
            if DATABASE_URL="$ADOPT_DATABASE_URL" python backend/tools/migrate_db.py \
              --adopt-current --acknowledge-populated-database; then
              echo "Adoption unexpectedly accepted ${mutation_name}."
              exit 1
            fi
            psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.topsignal_schema_migrations') is not null then
              raise exception 'rejected adoption left a migration ledger';
            end if;
            if exists (
              select 1 from topsignal_schema_baselines
              where version = 'schema-20260830-v6'
            ) then
              raise exception 'rejected adoption executed the security marker';
            end if;
            if not has_table_privilege('anon', 'public.accounts', 'select') then
              raise exception 'rejected adoption partially executed security hardening';
            end if;
            if exists (
              select 1 from pg_namespace
              where nspname like 'ts_adopt_expected_%'
            ) then
              raise exception 'rejected adoption leaked its model-validation schema';
            end if;
          end
          $$;
          SQL
          }

          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          alter table accounts alter column balance type numeric(18,5);
          SQL
          assert_adoption_rejected "a wrong numeric precision"
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          alter table accounts alter column balance type numeric(18,6);
          alter table journal_entries alter column title drop not null;
          SQL
          assert_adoption_rejected "a dropped NOT NULL constraint"
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          alter table journal_entries alter column title set not null;
          alter table bot_runs drop constraint bot_runs_bot_config_id_fkey;
          alter table bot_runs add constraint bot_runs_bot_config_id_fkey
            foreign key (bot_config_id) references bot_configs(id) on delete restrict;
          SQL
          assert_adoption_rejected "a wrong foreign-key ON DELETE action"
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          alter table bot_runs drop constraint bot_runs_bot_config_id_fkey;
          alter table bot_runs add constraint bot_runs_bot_config_id_fkey
            foreign key (bot_config_id) references bot_configs(id) on delete cascade;
          alter table accounts drop constraint accounts_archived_not_main_check;
          alter table accounts add constraint accounts_archived_not_main_check check (true);
          SQL
          assert_adoption_rejected "a weakened safety CHECK"
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          alter table accounts drop constraint accounts_archived_not_main_check;
          alter table accounts add constraint accounts_archived_not_main_check
            check (archived_at is null or not is_main);
          SQL

          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          drop index uq_bot_order_attempts_idempotency_key;
          create index uq_bot_order_attempts_idempotency_key
            on bot_order_attempts (user_id, bot_config_id, idempotency_key);
          SQL
          assert_adoption_rejected "a non-unique idempotency index"
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          drop index uq_bot_order_attempts_idempotency_key;
          create unique index uq_bot_order_attempts_idempotency_key
            on bot_order_attempts (user_id, bot_config_id, idempotency_key)
            where idempotency_key is not null;
          alter table provider_credentials
            drop constraint provider_credentials_user_id_provider_key;
          create unique index uq_provider_credentials_user_provider_adopt
            on provider_credentials (user_id, provider);
          SQL
          DATABASE_URL="$ADOPT_DATABASE_URL" python backend/tools/migrate_db.py \
            --adopt-current --acknowledge-populated-database
          DATABASE_URL="$ADOPT_DATABASE_URL" python backend/tools/migrate_db.py --check
          psql -h 127.0.0.1 -U postgres -d topsignal_adopt -v ON_ERROR_STOP=1 <<'SQL'
          create table public.topsignal_adoption_future_probe (id bigserial primary key);
          create function public.topsignal_adoption_future_probe_fn()
          returns integer language sql immutable as 'select 1';

          do $$
          declare
            api_role text;
          begin
            if not exists (
              select 1 from topsignal_schema_baselines
              where version = 'schema-20260830-v6'
            ) then
              raise exception 'adoption did not apply the v6 security baseline';
            end if;

            foreach api_role in array array['anon', 'authenticated']
            loop
              if has_table_privilege(
                api_role,
                'public.accounts',
                'select,insert,update,delete,truncate,references,trigger'
              )
                or has_sequence_privilege(
                  api_role,
                  'public.accounts_id_seq',
                  'usage,select,update'
                )
                or has_function_privilege(
                  api_role,
                  'public.topsignal_adoption_existing_probe_fn()',
                  'execute'
                )
                or has_table_privilege(
                  api_role,
                  'public.topsignal_adoption_future_probe',
                  'select,insert,update,delete,truncate,references,trigger'
                )
                or has_sequence_privilege(
                  api_role,
                  'public.topsignal_adoption_future_probe_id_seq',
                  'usage,select,update'
                )
                or has_function_privilege(
                  api_role,
                  'public.topsignal_adoption_future_probe_fn()',
                  'execute'
                )
              then
                raise exception 'adopted Data API role % retained public-schema access', api_role;
              end if;
            end loop;
          end
          $$;
          SQL

      - name: Run PostgreSQL concurrency regressions
        working-directory: backend
        env:
          TOPSIGNAL_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/topsignal
        run: python -m pytest -q tests/test_postgres_concurrency.py

      - name: Run isolated PostgreSQL worker fencing and timeout acceptance
        env:
          PGPASSWORD: postgres
          TOPSIGNAL_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/topsignal_audit_ci
        run: |
          createdb -h 127.0.0.1 -U postgres topsignal_audit_ci
          psql -h 127.0.0.1 -U postgres -d topsignal_audit_ci -v ON_ERROR_STOP=1 -f db/schema.sql
          cd backend
          python -m pytest -q tests/test_postgres_bot_safety.py

  backend_tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      AUTH_REQUIRED: "true"
      TOPSIGNAL_DB_SCHEMA_INIT: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -m pytest -q

  frontend_tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --fund=false

      - name: Run frontend tests
        run: npm --prefix frontend test

  frontend_quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --fund=false

      - name: Frontend lint
        run: npm --prefix frontend run lint -- --max-warnings=0

      - name: Deployment script regressions
        run: npm run test:dev-scripts

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Dependency audits
        run: |
          npm audit
          node scripts/audit-frontend.cjs

  windows_compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    env:
      AUTH_REQUIRED: "true"
      TOPSIGNAL_DB_SCHEMA_INIT: skip
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run backend tests with standard Windows paths
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --fund=false

      - name: Run portable frontend dependency audit
        run: node scripts/audit-frontend.cjs

      - name: Windows deployment script regressions
        run: npm run test:dev-scripts

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - database
      - backend_tests
      - frontend_tests
      - frontend_quality
      - windows_compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all CI lanes passed
        run: |
          test "${{ needs.database.result }}" = "success"
          test "${{ needs.backend_tests.result }}" = "success"
          test "${{ needs.frontend_tests.result }}" = "success"
          test "${{ needs.frontend_quality.result }}" = "success"
          test "${{ needs.windows_compatibility.result }}" = "success"
